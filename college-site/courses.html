<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Makes the website responsive on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Courses</title>

    <style>
        /* Styling the whole page */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            margin: 0;
            padding: 0;
            color: #333;
        }

        /* Styling the main heading */
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-top: 40px;
            margin-bottom: 25px;
        }

        /* Styling the table */
        table {
            width: 80%;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        /* Styling the caption */
        caption {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        /* Styling table headings */
        th {
            background-color: #3498db;
            color: white;
            padding: 15px;
            font-size: 18px;
        }

        /* Styling table cells */
        td {
            padding: 14px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        /* Alternate row colors */
        tbody tr:nth-child(even) {
            background-color: #f2f8fc;
        }

        /* Effect when mouse is placed over a row */
        tbody tr:hover {
            background-color: #dff0ff;
        }

        /* Styling the navigation area */
        nav {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background-color: #2c3e50;
        }

        /* Styling the links */
        nav a {
            display: inline-block;
            color: white;
            text-decoration: none;
            background-color: #3498db;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            transition: 0.3s;
        }

        /* Link hover effect */
        nav a:hover {
            background-color: #217dbb;
            transform: scale(1.05);
        }
        /* School logo */
        .school-logo {
    text-align: center;
    background-color: white;
    padding: 15px;
        }
        .school-logo img {
    width: 500px;
    max-width: 90%;
    height: auto;
}
    </style>
</head>

<body>

    <div class="school-logo">
        <img src="/images/school_fullinfologo.webp" alt="Shekhawati International Academy Logo">
    </div>
